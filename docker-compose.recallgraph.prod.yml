name: recallgraph-prod

services:
  recallgraph-prod-postgres:
    image: pgvector/pgvector:pg16
    container_name: recallgraph-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RECALLGRAPH_POSTGRES_DB:-recallgraph}
      POSTGRES_USER: ${RECALLGRAPH_POSTGRES_USER:-recallgraph}
      POSTGRES_PASSWORD: ${RECALLGRAPH_POSTGRES_PASSWORD:?set_RECALLGRAPH_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${RECALLGRAPH_POSTGRES_PORT:-54329}:5432"
    volumes:
      - recallgraph_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  recallgraph_prod_pgdata:
    name: recallgraph_prod_pgdata
